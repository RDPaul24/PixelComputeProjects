<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>To-Do List</h1>
            <input
                type="search"
                id="search-input"
                class="search-input"
                placeholder="Search tasks..."
                aria-label="Search tasks"
            >
        </header>

        <form id="task-form" class="task-form" novalidate>
            <input
                type="text"
                id="task-input"
                placeholder="Add your to-do task..."
                aria-label="Task description"
                autocomplete="off"
            >

            <input
                type="date"
                id="task-date"
                aria-label="Task due date"
            >

            <input
                type="time"
                id="task-time"
                aria-label="Task due time"
            >

            <button type="submit" class="add-button">Add Task</button>
        </form>

        <div id="task-sections" aria-live="polite"></div>

        <form id="edit-panel" class="edit-panel" hidden>
            <h2 id="edit-date" class="edit-date"></h2>

            <label for="edit-input" class="visually-hidden">
                Edit task description
            </label>

            <input
                type="text"
                id="edit-input"
                placeholder="Edit your task..."
                autocomplete="off"
            >

            <div class="edit-actions">
                <button type="submit" class="save-button">Save Changes</button>
                <button type="button" id="cancel-edit" class="cancel-button">
                    Cancel
                </button>
            </div>
        </form>
    </main>

    <div id="validation-modal" class="modal" hidden>
        <div class="modal-backdrop"></div>

        <div
            class="modal-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-message"
        >
            <button
                type="button"
                id="modal-close"
                class="modal-close"
                aria-label="Close message"
            >×</button>

            <p id="modal-message">Please fill in all fields.</p>

            <button type="button" id="modal-ok" class="modal-ok">
                OK
            </button>
        </div>
    </div>
</body>
</html>
